data:
  raw_dir: "/root/nguyen/research/ML/Final/raw/images"
  processed_dir: "/root/nguyen/research/ML/Final"
  augmented_dir: "/root/nguyen/research/ML/Final/dataset_aug"
  image_size: 224
  batch_size: 128
  num_workers: 4

  test_size: 0.2
  random_state: 42
  stratify: true

model:
  name: "resnet18"  
  num_classes: 7
  pretrained: true
  dropout_rate: 0.5
  hidden_size: 512
  learning_rate: 0.001
  weight_decay: 0.0001
  momentum: 0.9
  
training:
  epochs: 50
  criterion: "cross_entropy"
  checkpoint_dir: "checkpoints"
  early_stopping_patience: 5
  use_class_weights: true


optimizer:
  name: "adam"  # options: adam, sgd
  learning_rate: 0.001
  weight_decay: 0.0001
  momentum: 0.9  # only for SGD

scheduler:
  name: "reduce_on_plateau"  # options: reduce_on_plateau, cosine
  factor: 0.1
  patience: 3
  min_lr: 1e-6

augmentation:
  target_samples: 2000
  rotate_limit: 45
  brightness_contrast_limit: 0.2
  use_color_augmentation: true
  use_noise_augmentation: true
  min_visibility: 0.8
  scale_limit: 0.1

paths:
  metadata: "/root/nguyen/research/ML/Final/raw/GroundTruth.csv"
  train_metadata: "/root/nguyen/research/ML/Final/train_metadata.csv"
  test_metadata: "/root/nguyen/research/ML/Final/test_metadata.csv"
  test_metadata: "/root/nguyen/research/ML/Final/augmented_metadata.csv"

logging:
  log_dir: "logs"
  level: "INFO"

visualization:
  output_dir: "visualizations"
  dpi: 300
  figure_formats: ["png", "pdf"]
  style: "seaborn"

data_analysis:
  min_samples_per_class: 1000
  target_aspect_ratio: 1.0
  image_size_analysis: true
  plot_examples: true
  examples_per_class: 5